# Override of compose.yaml for the smoke test (tests/central/smoke.sh): an ssh-agent
# sidecar holding the test key, the worker on the network of the SSH target, and no port
# published on the host (the client runs inside "web").
services:
  agent:
    image: aridi-central:latest
    user: "0"
    network_mode: none
    # ssh-agent only answers clients with its own uid: it runs as 10001, like the worker
    # (README.md, "Preparing the central"). The key is copied so that it is owned by 10001.
    command: ["sh", "-c", "install -d -o 10001 -g 10001 -m 0700 /run/aridi-agent && install -o 10001 -g 10001 -m 0600 /k/id /tmp/id && rm -f /run/aridi-agent/sock && exec setpriv --reuid=10001 --regid=10001 --clear-groups sh -c 'ssh-agent -D -a /run/aridi-agent/sock & sleep 1; SSH_AUTH_SOCK=/run/aridi-agent/sock ssh-add -q /tmp/id && rm /tmp/id && wait'"]
    volumes:
      - agent:/run/aridi-agent
      - ${SMOKE_KEYS:?}:/k:ro
  web:
    ports: !reset []
  worker:
    environment:
      SSH_AUTH_SOCK: /run/aridi-agent/sock
    volumes:
      - agent:/run/aridi-agent
    networks: [default, ssh]
    depends_on:
      agent:
        condition: service_started

volumes:
  agent:

networks:
  ssh:
    external: true
    name: aridi-central-ssh
