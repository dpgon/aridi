# Corpus VM: Debian 12, x86_64 emulated with QEMU on arm64 hosts (TODO.md, phase 1.2).
# Same content as debian12-arm64.yaml; exists to have x86_64 /proc/cpuinfo and binaries.
# Slow: provisioning can take several minutes. Created and deleted by capture-vm.sh.
base: template://debian-12
arch: x86_64
vmType: qemu
cpus: 2
memory: 2GiB
disk: 10GiB
mounts: []
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends openssh-server openssh-client nftables \
        systemd-timesyncd sudo iproute2 procps socat
      useradd -m -s /bin/bash aridi || true
      # TEST VM ONLY: full passwordless sudo until TODO.md 5.0 decides the real rule.
      echo 'aridi ALL=(root) NOPASSWD: ALL' > /etc/sudoers.d/aridi
      chmod 0440 /etc/sudoers.d/aridi
