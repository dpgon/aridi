# Corpus VM: Ubuntu 24.04 LTS, arm64 native (FUTURE.md 1.6: Ubuntu in a VM).
# Same content as debian12-arm64.yaml: systemd, sshd with real sessions, nftables,
# systemd-timesyncd. Created and deleted by tests/lima/capture-vm.sh.
base: template://ubuntu-24.04
arch: aarch64
cpus: 2
memory: 2GiB
disk: 10GiB
# No host directories inside the VM (see debian12-arm64.yaml): capture-vm.sh passes
# --mount-none, because Lima appends the base template mounts to this list.
mounts: []
# Neutral guest user: by default Lima copies the host user name and full name (GECOS).
user:
  name: lima
  comment: lima corpus user
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends openssh-server openssh-client nftables \
        systemd-timesyncd sudo iproute2 procps socat
      useradd -m -s /bin/bash aridi || true
      # The sudo rule decided in TODO.md 5.0: only the installed collector, no arguments.
      echo 'aridi ALL=(root) NOPASSWD: /usr/local/libexec/aridi-collect.sh ""' \
        > /etc/sudoers.d/aridi
      chmod 0440 /etc/sudoers.d/aridi
